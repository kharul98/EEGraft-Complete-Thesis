<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="297mm" version="1.1" viewBox="0 0 1000 1414" width="210mm"><defs /><rect fill="#FFFFFF" height="1414" width="1000" x="0" y="0" /><rect fill="#142B42" height="37" rx="9" ry="9" stroke="none" stroke-width="1.5" width="163" x="44" y="36" /><text fill="#FFFFFF" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.25" text-anchor="middle" x="125" y="61">EEGRAFT</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="33" font-weight="700" text-anchor="start" x="44" y="120">Overall Research Methodology</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="33" font-weight="700" text-anchor="start" x="44" y="163">and Experimental Pipeline</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17.8" font-weight="400" text-anchor="start" x="44" y="200">Three studies, separate evaluation protocols, one reliability question</text><line stroke="#142B42" stroke-linecap="round" stroke-width="2.5" x1="44" x2="956" y1="219" y2="219" /><text fill="#2969A3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="44" y="251">01</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.3" text-anchor="start" x="85" y="251">DATA SOURCES</text><rect fill="#F4F8FD" height="168" rx="16" ry="16" stroke="#BDD4E8" stroke-width="1.7" width="444" x="44" y="268" /><rect fill="#2969A3" height="48" rx="16" ry="16" stroke="none" stroke-width="1.5" width="444" x="44" y="268" /><rect fill="#2969A3" height="20" rx="0" ry="0" stroke="none" stroke-width="1.5" width="444" x="44" y="296" /><text fill="#FFFFFF" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="65" y="299">NEMAR on004504  ·  SOURCE COHORT</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="65" y="345">88 participants</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="65" y="371">36 AD  /  23 FTD  /  29 controls</text><line stroke="#D0DEEB" stroke-linecap="round" stroke-width="1" x1="65" x2="465" y1="385" y2="385" /><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.6" font-weight="400" text-anchor="start" x="65" y="411">Original EEG source for Studies A and B</text><rect fill="#F0FAF8" height="168" rx="16" ry="16" stroke="#BDDDD7" stroke-width="1.7" width="444" x="512" y="268" /><rect fill="#16877F" height="48" rx="16" ry="16" stroke="none" stroke-width="1.5" width="444" x="512" y="268" /><rect fill="#16877F" height="20" rx="0" ry="0" stroke="none" stroke-width="1.5" width="444" x="512" y="296" /><text fill="#FFFFFF" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="533" y="299">CAUEEG  ·  EXTERNAL COHORT</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="533" y="345">1,122 recordings</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.8" font-weight="400" text-anchor="start" x="533" y="369">Train 950   /   Validation 82   /   Test 90</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.2" font-weight="400" text-anchor="start" x="533" y="393">436 normal  /  395 MCI  /  291 dementia</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14.8" font-weight="400" text-anchor="start" x="533" y="417">Recording IDs ≠ verified unique patients</text><rect fill="#E7F1FA" height="33" rx="7" ry="7" stroke="none" stroke-width="1.5" width="444" x="44" y="450" /><text fill="#2969A3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14.7" font-weight="700" text-anchor="middle" x="266" y="472">NEMAR → separate Study A and Study B protocols</text><rect fill="#E3F5F1" height="33" rx="7" ry="7" stroke="none" stroke-width="1.5" width="444" x="512" y="450" /><text fill="#16877F" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14.7" font-weight="700" text-anchor="middle" x="734" y="472">CAUEEG → frozen transfer in Study C</text><rect fill="#F7FAFD" height="301" rx="16" ry="16" stroke="#BBD0E4" stroke-width="1.6" width="444" x="44" y="504" /><rect fill="#2969A3" height="51" rx="16" ry="16" stroke="none" stroke-width="1.5" width="444" x="44" y="504" /><rect fill="#2969A3" height="21" rx="0" ry="0" stroke="none" stroke-width="1.5" width="444" x="44" y="534" /><rect fill="#FCFAFD" height="301" rx="16" ry="16" stroke="#D3C3E4" stroke-width="1.6" width="444" x="512" y="504" /><rect fill="#7354A5" height="51" rx="16" ry="16" stroke="none" stroke-width="1.5" width="444" x="512" y="504" /><rect fill="#7354A5" height="21" rx="0" ry="0" stroke="none" stroke-width="1.5" width="444" x="512" y="534" /><text fill="#FFFFFF" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="65" y="537">A  |  TEMPORAL RELIABILITY</text><text fill="#FFFFFF" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="533" y="537">B  |  EEGRAFT DECODER</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="66" y="589">64 participants: 23 AD, 18 FTD, 23 controls</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="66" y="615">Tasks: AD vs CN (46); FTD vs CN (41)</text><line stroke="#D4E1ED" stroke-linecap="round" stroke-width="1.5" x1="66" x2="464" y1="631" y2="631" /><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="66" y="662">Spectral EEG features → RBF SVM</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.8" font-weight="400" text-anchor="start" x="66" y="691">Five 60-second recording intervals</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.8" font-weight="400" text-anchor="start" x="66" y="718">Repeated participant-wise evaluation</text><line stroke="#D4E1ED" stroke-linecap="round" stroke-width="1.5" x1="66" x2="464" y1="739" y2="739" /><text fill="#2969A3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.4" font-weight="700" text-anchor="start" x="66" y="769">Output: correctness, flips, stable errors</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="534" y="589">65 participants: 36 AD, 29 controls</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="534" y="615">52 development + 13 locked-test people</text><line stroke="#DFD5EB" stroke-linecap="round" stroke-width="1.5" x1="534" x2="930" y1="631" y2="631" /><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="534" y="662">EEG → 4-s windows (up to 24)</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.8" font-weight="400" text-anchor="start" x="534" y="691">Frozen CBraMod + dual-scale Conv1D</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.8" font-weight="400" text-anchor="start" x="534" y="718">Gated residual fusion + class attention</text><line stroke="#DFD5EB" stroke-linecap="round" stroke-width="1.5" x1="534" x2="930" y1="739" y2="739" /><text fill="#7354A5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.2" font-weight="700" text-anchor="start" x="534" y="769">Baselines, ablations, locked holdout</text><line stroke="#7354A5" stroke-linecap="round" stroke-width="3" x1="734" x2="734" y1="805" y2="821" /><line stroke="#7354A5" stroke-linecap="round" stroke-width="3" x1="734" x2="734" y1="821" y2="843" /><polygon fill="#7354A5" points="729.205744613958,834.2241743810963 734,843 738.794255386042,834.2241743810963" /><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="end" x="511" y="830">Frozen source models transferred; no retraining</text><rect fill="#F6FCFA" height="307" rx="16" ry="16" stroke="#AAD8D0" stroke-width="1.8" width="912" x="44" y="850" /><rect fill="#16877F" height="52" rx="16" ry="16" stroke="none" stroke-width="1.5" width="912" x="44" y="850" /><rect fill="#16877F" height="21" rx="0" ry="0" stroke="none" stroke-width="1.5" width="912" x="44" y="881" /><text fill="#FFFFFF" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="66" y="884">C  |  EXTERNAL CAUEEG TRANSFER AND RELIABILITY AUDIT</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17.1" font-weight="400" text-anchor="start" x="67" y="930">Frozen models: source-trained EEGraft DSRF and XGBoost</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17.1" font-weight="400" text-anchor="start" x="67" y="956">Primary task: dementia vs normal; MCI is descriptive only</text><rect fill="#FFFFFF" height="76" rx="11" ry="11" stroke="#CDDCD8" stroke-width="1.3" width="255" x="66" y="975" /><text fill="#2969A3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="81" y="1004">TRAIN  ·  950</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14.2" font-weight="400" text-anchor="start" x="81" y="1030">616 binary · train-only fit</text><rect fill="#FFFFFF" height="76" rx="11" ry="11" stroke="#CDDCD8" stroke-width="1.3" width="255" x="344" y="975" /><text fill="#7354A5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="359" y="1004">VALIDATION  ·  82</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14.2" font-weight="400" text-anchor="start" x="359" y="1030">Exploratory development checks</text><rect fill="#FFFFFF" height="76" rx="11" ry="11" stroke="#CDDCD8" stroke-width="1.3" width="311" x="622" y="975" /><text fill="#16877F" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="637" y="1004">LOCKED TEST  ·  90</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14.2" font-weight="400" text-anchor="start" x="637" y="1030">57 binary: 35 normal / 22 dementia</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.7" font-weight="700" text-anchor="start" x="67" y="1085">Frozen-test BAcc: EEGraft 68.38%   |   XGBoost (0.50) 58.57%</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.3" font-weight="400" text-anchor="start" x="67" y="1115">Train-selected XGBoost 0.70; Platt variants are exploratory.</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.3" font-weight="400" text-anchor="start" x="67" y="1138">Condition and age audits: development data only, post-hoc.</text><line stroke="#DDE5EC" stroke-linecap="round" stroke-width="2" x1="44" x2="956" y1="1183" y2="1183" /><text fill="#2969A3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="44" y="1215">02</text><text fill="#142B42" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.0" text-anchor="start" x="85" y="1215">INTEGRATED RELIABILITY ASSESSMENT</text><rect fill="#EDF5FC" height="110" rx="12" ry="12" stroke="#2969A3" stroke-width="1.5" width="284" x="44" y="1235" /><rect fill="#2969A3" height="88" rx="3" ry="3" stroke="none" stroke-width="1.5" width="6" x="56" y="1246" /><text fill="#2969A3" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="73" y="1272">CLASSIFICATION</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.0" font-weight="400" text-anchor="start" x="73" y="1305">BAcc · AUROC · Brier · errors</text><rect fill="#F4EDF9" height="110" rx="12" ry="12" stroke="#7354A5" stroke-width="1.5" width="284" x="358" y="1235" /><rect fill="#7354A5" height="88" rx="3" ry="3" stroke="none" stroke-width="1.5" width="6" x="370" y="1246" /><text fill="#7354A5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="387" y="1272">CONSISTENCY</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.0" font-weight="400" text-anchor="start" x="387" y="1305">Window flips · stable-but-wrong</text><rect fill="#ECF8F5" height="110" rx="12" ry="12" stroke="#16877F" stroke-width="1.5" width="284" x="672" y="1235" /><rect fill="#16877F" height="88" rx="3" ry="3" stroke="none" stroke-width="1.5" width="6" x="684" y="1246" /><text fill="#16877F" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="701" y="1263">CONTEXT &amp;</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.3" font-weight="400" text-anchor="start" x="701" y="1310">Threshold · eye state · time</text><text fill="#53677D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15.3" font-weight="400" text-anchor="start" x="701" y="1332">Age · diagnostic labels</text><rect fill="#142B42" height="37" rx="9" ry="9" stroke="none" stroke-width="1.5" width="912" x="44" y="1360" /><text fill="#FFFFFF" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16.7" font-weight="700" text-anchor="middle" x="500" y="1384">CORE QUESTION  |  When is an apparently stable EEG prediction actually reliable?</text><text fill="#16877F" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="701" y="1287">CONFOUNDS</text></svg>